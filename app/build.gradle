plugins {
    id 'com.android.application' version '8.1.4'
}

android {
    namespace 'com.example.myminecraft'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myminecraft"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
